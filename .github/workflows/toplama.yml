# Her gece: GitHub'dan veri topla, data dalına kaydet, panoyu yayınla, bülteni gönder.
name: Günlük veri toplama

on:
  schedule:
    - cron: "17 1 * * *"   # Her gün 01:17 UTC = İstanbul 04:17
  workflow_dispatch:         # Actions sekmesinden elle "Run workflow"

permissions:
  contents: read             # Varsayılan: sadece okuma. İhtiyacı olan iş fazlasını ister.

concurrency:
  group: veri-toplama
  cancel-in-progress: false

env:
  PANO_URL: https://beyza-karace41.github.io/devpulse-mcp/

jobs:
  topla:
    name: Topla, kaydet, panoyu hazırla
    runs-on: ubuntu-latest
    permissions:
      contents: write        # data dalına push için
    steps:
      - name: Kodu indir (main)
        uses: actions/checkout@v5

      - name: Veritabanını indir (data dalı)
        uses: actions/checkout@v5
        with:
          ref: data
          path: veri

      - name: Python 3.13 kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Projeyi kur
        run: pip install .

      - name: Toplayıcıyı çalıştır
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVPULSE_DB: veri/devpulse.db
        run: devpulse-topla

      - name: Veritabanını data dalına kaydet
        working-directory: veri
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add devpulse.db
          git commit -m "data: $(date -u +%F) günlük fotoğraf" || echo "Değişiklik yok"
          git push

      - name: Panoyu oluştur
        env:
          DEVPULSE_DB: veri/devpulse.db
        run: devpulse-pano --cikti site

      - name: Panoyu Pages için paketle
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Bülteni e-postayla gönder
        env:
          DEVPULSE_DB: veri/devpulse.db
          DEVPULSE_SMTP_KULLANICI: ${{ secrets.DEVPULSE_SMTP_KULLANICI }}
          DEVPULSE_SMTP_SIFRE: ${{ secrets.DEVPULSE_SMTP_SIFRE }}
          DEVPULSE_PANO_URL: ${{ env.PANO_URL }}
        run: devpulse-rapor --gonder

  yayinla:
    name: Panoyu yayınla
    needs: topla             # topla bitmeden başlamaz
    runs-on: ubuntu-latest
    permissions:
      pages: write           # Pages'e yayın yapabilmek için
      id-token: write        # GitHub'a "bu yayını gerçekten bu workflow yapıyor" kanıtı
    environment:
      name: github-pages
      url: ${{ steps.dagitim.outputs.page_url }}
    steps:
      - name: GitHub Pages'e dağıt
        id: dagitim
        uses: actions/deploy-pages@v4
