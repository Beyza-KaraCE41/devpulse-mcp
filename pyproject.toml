[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devpulse-mcp"
version = "0.1.0"
description = "GitHub, PyPI, npm ve Hacker News trendlerini takip eden bir MCP sunucusu"
requires-python = ">=3.11"
authors = [{ name = "Beyza Nur Kara" }]
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/devpulse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]